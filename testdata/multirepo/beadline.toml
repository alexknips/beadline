# Synthetic three-repo fixture: see ../README.md.

[[repos]]
name = "api"
export = "api.jsonl"
concurrency = 3

[[repos]]
name = "web"
export = "web.jsonl"

[[repos]]
name = "hq"
export = "hq.jsonl"
concurrency = 1

[conventions]
high_level_types = ["milestone", "epic"]
goal_label_pattern = "^goal:(?P<id>.+)$"
human_gate_title_patterns = ["^HUMAN:"]
human_gate_metadata_keys = ["awaiting_signoff", "hold_reason"]
