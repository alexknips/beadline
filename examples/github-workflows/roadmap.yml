# Template: build beadline, run it against a repo with a .beads directory,
# and publish roadmap.html to GitHub Pages. Copy this into that repo's
# .github/workflows/, adjusting the "Forecast" step for your layout (more
# PATHs, or a beadline.toml, for several repos).
#
# Assumes `bd` can already read your beads data in CI — an embedded Dolt
# store checked into the repo, or a remote your bd is configured to pull
# from — the same requirement as any other bd-based CI job. This installs
# bd in its simplest (server-mode-only) build; if your project needs the
# embedded-capable build instead, see beads' installation docs.
#
# One-time setup after copying: Settings -> Pages -> Source: GitHub Actions.
name: roadmap
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours; a roadmap is only as fresh as its last run
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }

      - name: Install beadline and bd
        run: |
          go install github.com/alexknips/beadline/cmd/beadline@latest
          CGO_ENABLED=0 go install github.com/steveyegge/beads/cmd/bd@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Forecast
        run: |
          mkdir -p site
          beadline -o site .

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
