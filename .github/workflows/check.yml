name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
        if: hashFiles('go.mod') != ''
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
        if: hashFiles('package.json') != ''
      - run: make check
